name: CI

on:
  pull_request:
  push:
    branches:
      - release/v3.5.49-snapshot
      - feat/session-move-rename

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npm run build
      - run: npm test
