name: Build and verify package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install tmux for live terminal tests
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Materialize and verify reviewed native launcher
        run: npm run prepare:vnc-launcher

      - name: Test in a disposable root-owned checkout
        run: |
          test_root="$(sudo mktemp -d /var/lib/deckide-ci.XXXXXXXX)"
          tar --exclude='./.git' --exclude='./tmp' --exclude='./data' \
            --exclude='./artifacts' -cf - . | \
            sudo tar --no-same-owner -xf - -C "$test_root"
          sudo env PATH="$PATH" TERM=xterm-256color DECKIDE_TMUX_TEST_WITH_BROKER=1 \
            bash -c 'cd "$1" && npm test' bash "$test_root"

      - name: Pack and verify runtime inventory
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          version="$(node -p "require('./package.json').version")"
          node scripts/verify-runtime-package.mjs "$RUNNER_TEMP/deckide-${version}.tgz"
